name: Deploy to Dev Environment

on:
    push:
        branches:
            - develop
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: "actions/checkout@v4"

            - name: Write env file
              run: echo "${{ secrets.STAGING_WEB_ENV }}" > apps/web/.env

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to DigitalOcean registry
              uses: docker/login-action@v4
              with:
                  registry: registry.digitalocean.com
                  username: ${{ vars.DIGITALOCEAN_USERNAME }}
                  password: ${{ secrets.DOCR_TOKEN }}

            - name: Build and push backend
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: api-runner
                  platforms: linux/amd64
                  push: true
                  tags: registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/backend:staging
                  cache-from: type=registry,scope=backend
                  cache-to: type=registry,scope=backend,mode=max

            - name: Build and push caddy
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: caddy
                  platforms: linux/amd64
                  push: true
                  tags: registry.digitalocean.com/${{ secrets.REGISTRY_NAME }}/caddy:staging
                  cache-from: type=registry,scope=caddy
                  cache-to: type=registry,scope=caddy,mode=max

            - name: Deploy to droplet
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DROPLET_HOST }}
                  username: ${{ secrets.DROPLET_USER }}
                  key: ${{ secrets.DROPLET_SSH_KEY }}
                  script: |
                      cd /var/www/tcup-development
                      IMAGE_TAG=staging docker compose pull
                      IMAGE_TAG=staging docker compose up -d

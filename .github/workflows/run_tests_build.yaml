name: Run Tests & Build

on:
    pull_request:
        branches:
            - develop
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                  version: "11.7.0"

            - name: Install dependencies
              run: pnpm install

            - name: Run tests
              run: pnpm test

            - name: Run build
              run: pnpm run build
